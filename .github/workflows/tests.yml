name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        django-version: ["4.2", "5.2", "6.0"]
        exclude:
          # Django 5.2 requires Python 3.10+
          - python-version: "3.8"
            django-version: "5.2"
          - python-version: "3.9"
            django-version: "5.2"
          # Django 6.0 requires Python 3.12+
          - python-version: "3.8"
            django-version: "6.0"
          - python-version: "3.9"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"

    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Django ${{ matrix.django-version }}
        run: pip install "django>=${{ matrix.django-version }},<${{ matrix.django-version }}.99"

      - name: Run tests
        run: python followit/tests/runtests.py
